<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DompetKu Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="logo">👑</span> DompetKu
      </div>
      <nav class="nav-menu">
        <button class="nav-item active" data-target="sec-dashboard">📊 Dashboard</button>
        <button class="nav-item" data-target="sec-input">➕ Input Transaksi</button>
        <button class="nav-item" data-target="sec-riwayat">📜 Riwayat Transaksi</button>
        <button class="nav-item" data-target="sec-import">📑 Import CSV</button>
      </nav>
    </div>

    <!-- TOMBOL LOGOUT POJOK BAWAH -->
    <div class="sidebar-bottom">
      <button class="btn-logout" id="btnLogout">🚪 Logout</button>
    </div>
  </aside>

  <!-- KONTEN UTAMA -->
  <main class="main-content">
    
    <!-- HALAMAN 1: DASHBOARD -->
    <section id="sec-dashboard" class="page-section active">
      <div class="card-dashboard">
        <h2 class="card-title">Dashboard Saldo</h2>

        <div class="total-saldo-box">
          <span class="saldo-label">Total Saldo</span>
          <h1 id="totalSaldoDisplay">Rp 0</h1>
        </div>

        <div class="stat-box-container">
          <div class="stat-box masuk">
            <span>Pemasukan</span>
            <h3 id="pemasukanDisplay">Rp 0</h3>
          </div>
          <div class="stat-box keluar">
            <span>Pengeluaran</span>
            <h3 id="pengeluaranDisplay">Rp 0</h3>
          </div>
        </div>

        <button class="btn-pull-data" id="btnSync">🔄 Tarik Data Otomatis (Gmail)</button>
      </div>
    </section>

    <!-- HALAMAN 2: INPUT TRANSAKSI -->
    <section id="sec-input" class="page-section hidden">
      <div class="card-dashboard">
        <h2 class="card-title">Input Transaksi Manual</h2>
        
        <form id="formInputManual" class="form-manual">
          <div class="form-group">
            <label>Keterangan Transaksi</label>
            <input type="text" id="inputKeterangan" placeholder="Contoh: Beli Kopi / Transfer" required>
          </div>

          <div class="form-group">
            <label>Nominal (Rp)</label>
            <input type="number" id="inputNominal" placeholder="50000" min="1" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Jenis Transaksi</label>
              <select id="inputJenis">
                <option value="keluar">Pengeluaran (-)</option>
                <option value="masuk">Pemasukan (+)</option>
              </select>
            </div>

            <div class="form-group">
              <label>Sumber Dana</label>
              <select id="inputSumber">
                <option value="BRI">BRI</option>
                <option value="CIMB">CIMB (OCTO)</option>
                <option value="DANA">DANA</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn-submit">💾 Simpan Transaksi</button>
        </form>
      </div>
    </section>

    <!-- HALAMAN 3: RIWAYAT TRANSAKSI -->
    <section id="sec-riwayat" class="page-section hidden">
      <div class="card-riwayat">
        <h3>Riwayat Transaksi</h3>
        <div id="riwayatList" class="riwayat-list"></div>
      </div>
    </section>

    <!-- HALAMAN 4: IMPORT CSV -->
    <section id="sec-import" class="page-section hidden">
      <div class="card-dashboard">
        <h2 class="card-title">Import File CSV</h2>
        <p style="color:#64748b; text-align:center;">Fitur import CSV dapat ditambahkan di sini.</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
